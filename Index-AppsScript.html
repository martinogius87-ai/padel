<!DOCTYPE html>
<html lang="it"><head><base target="_top"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#071B3E;--navy2:#0B2559;--red:#E8192C;--orange:#F04E23;--ink:#17365D;--bg:#EEF2F8;--ok:#14A44D;--D1:#E8192C;--D2A:#1D4ED8;--D2B:#4D93D9;--D2:#1D4ED8;--FEM:#C2378F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:20px 16px 70px;text-align:center;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--red)}
.logo{display:inline-block;margin:0 auto 14px;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-height:60px}
.logo img{width:130px;height:auto;display:block}
.logo .fb{font-family:'Barlow Condensed';font-weight:800;font-size:26px;color:var(--navy);line-height:1}
.logo .fb span{color:var(--orange)}
h1{font-family:'Barlow Condensed';font-weight:800;font-size:32px;letter-spacing:1px;margin:0;line-height:1}h1 span{color:var(--red)}
.sub{opacity:.8;font-size:14px;margin-top:6px;letter-spacing:.6px;text-transform:uppercase}
.tools{max-width:640px;margin:-54px auto 0;padding:0 12px;position:relative;z-index:2}
.search{width:100%;padding:17px 18px;font-size:17px;border:0;border-radius:14px;box-shadow:0 6px 20px rgba(7,27,62,.2);font-family:inherit;outline:none;margin-bottom:12px}
.mebar{background:#fff;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(7,27,62,.12);min-height:44px}
.mebar b{color:var(--navy)}
.mebar button{margin-left:auto;background:none;border:0;color:var(--red);font-weight:700;font-size:14px;font-family:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:0 0 auto;border:2px solid var(--navy2);background:#fff;color:var(--navy2);padding:9px 15px;border-radius:30px;font-weight:700;font-size:14px;font-family:inherit}
.chip.on{background:var(--navy2);color:#fff}
main{max-width:640px;margin:0 auto;padding:4px 12px 20px}
.sect{display:inline-block;font-family:'Barlow Condensed';font-weight:800;font-size:16px;letter-spacing:1.5px;color:#fff;background:var(--navy2);padding:6px 14px;border-radius:8px;margin:22px 2px 2px}
.sect.rec{background:var(--red)}.sect.mine-s{background:var(--orange)}
.day{font-family:'Barlow Condensed';font-weight:700;font-size:21px;color:var(--navy);margin:16px 4px 10px;display:flex;align-items:center;gap:10px;text-transform:capitalize}
.day::after{content:"";flex:1;height:2px;background:#cfd8e6}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(7,27,62,.08);border-left:7px solid var(--c);cursor:pointer}
.card:active,.mc:active{transform:scale(.985)}
.card.mine{border:3px solid var(--orange);border-left:9px solid var(--orange);margin-top:10px;box-shadow:0 6px 20px rgba(240,78,35,.22)}
.card.ghost{background:#F6F7FA;opacity:.85;box-shadow:none;border-left:7px dashed #9aa6b8}
.card.ghost .teams{color:#7b8aa3;text-decoration:line-through;text-decoration-color:rgba(123,138,163,.5)}
.cta{margin-top:12px;background:var(--red);color:#fff;text-align:center;border-radius:12px;padding:15px;font-family:'Barlow Condensed';font-weight:800;font-size:21px;letter-spacing:1px}
.cta.sec{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:12px 6px;border-radius:12px;border:2px solid #cfd8e6;background:#fff;font-weight:700;font-size:14px;font-family:inherit;color:var(--navy2)}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:#5a6b85;font-weight:600;flex-wrap:wrap}
.tag{background:var(--c);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700}
.code{margin-left:auto;font-family:'Barlow Condensed';font-size:15px;color:#8a97ab}
.teams{margin:10px 0 10px;font-weight:700;font-size:16px;line-height:1.3}
.vs{color:var(--red);font-family:'Barlow Condensed';font-size:14px;margin:2px 0}
.pill{display:inline-block;border-radius:30px;padding:7px 13px;font-size:13px;font-weight:700;margin:2px 4px 2px 0}
.todo{background:#FFE8EA;color:var(--red)}.sent{background:#E3F6EA;color:#0E7A38}.offi{background:#E6EEFB;color:var(--navy2)}.spo{background:#FFF1EC;color:var(--orange)}
.rin{background:#FFF6DB;color:#9A6B00}
.box{display:block;text-align:center;margin-bottom:6px;border-radius:12px}
.empty,.loader{text-align:center;padding:44px 10px;color:#6b7c95}
.hb{background:#fff;border-left:6px solid var(--orange);border-radius:12px;padding:12px 40px 12px 14px;margin-top:12px;font-size:14px;line-height:1.4;position:relative;box-shadow:0 2px 8px rgba(7,27,62,.08)}
.hb a{color:var(--red);font-weight:700;cursor:pointer;white-space:nowrap}
.hb button{position:absolute;right:6px;top:6px;border:0;background:none;font-size:18px;color:#8a97ab;width:32px;height:32px}
.gpills{display:flex;gap:8px;overflow-x:auto;padding:12px 2px}
.gp{flex:0 0 auto;width:50px;height:50px;border-radius:50%;border:2px solid #cfd8e6;background:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:17px;color:var(--navy2)}
.gp.done{border-color:var(--ok);color:var(--ok)}
.gp.on{background:var(--red);border-color:var(--red);color:#fff}
.mc{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:6px solid var(--c);box-shadow:0 2px 8px rgba(7,27,62,.07);cursor:pointer}
.mc.me{border:2px solid var(--orange);border-left:6px solid var(--orange)}
.mc .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;padding:4px 0;color:#41536f}
.mc .row.w{font-weight:800;color:var(--navy)}
.mc .row.w>span:first-child::after{content:" 🏆";font-size:13px}
.sc{font-family:'Barlow Condensed';font-weight:800;font-size:20px;white-space:nowrap}
.sc span{display:inline-block;width:24px;text-align:center}
.mc .meta{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(7,27,62,.08);margin-top:12px}
.tbl th{background:var(--navy);color:#fff;font-family:'Barlow Condensed';font-size:14px;letter-spacing:.5px;padding:10px 4px}
.tbl td{padding:10px 4px;border-bottom:1px solid #eef1f6;text-align:center;font-weight:700;font-size:15px}
.tbl td.n{text-align:left;font-size:14px;line-height:1.25;color:var(--navy)}
.tbl td.n small{display:block;color:#8a97ab;font-weight:600;font-size:12px;margin-top:2px}
.tbl td.pt{font-family:'Barlow Condensed';font-size:22px;color:var(--red)}
.pos{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;background:#eef1f6;font-family:'Barlow Condensed';font-size:16px}
.up,.dn{display:block;font-size:11px;font-weight:800;margin-top:2px}.up{color:var(--ok)}.dn{color:var(--red)}
.tbl tr.q .pos{background:var(--navy2);color:#fff}
.tbl tr.me td{background:#FFF1EC}.tbl tr.me .pos{background:var(--orange);color:#fff}
.nota{font-size:13px;color:#5a6b85;font-weight:600;margin:12px 4px;line-height:1.4}
.nota b{color:var(--navy2)}
.fc{background:#fff;border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 2px 8px rgba(7,27,62,.07);border-left:6px solid var(--c)}
.fc .ph{font-family:'Barlow Condensed';font-weight:800;color:var(--c);font-size:15px;letter-spacing:.5px}
.fc .row{display:flex;justify-content:space-between;font-weight:700;padding:3px 0;font-size:15px}
.fc .row.w{color:var(--navy)}.fc .row.w::after{content:"🏆"}
.fc .tbd{color:#9aa6b8;font-style:italic;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.kpi{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(7,27,62,.07)}
.kpi b{display:block;font-family:'Barlow Condensed';font-size:32px;color:var(--navy);line-height:1}
.kpi span{font-size:11px;font-weight:700;color:#5a6b85;text-transform:uppercase;letter-spacing:.4px}
.aw{background:#fff;border-radius:14px;padding:13px 16px;margin-top:10px;box-shadow:0 2px 8px rgba(7,27,62,.07);border-left:6px solid var(--c)}
.aw .t{font-weight:700;font-size:13px;color:#5a6b85;text-transform:uppercase;letter-spacing:.4px}
.aw .v{font-family:'Barlow Condensed';font-size:21px;font-weight:800;color:var(--navy);margin:3px 0 2px;line-height:1.15}
.aw .d{font-size:13px;color:#5a6b85;font-weight:600}
.aw.off{opacity:.5}
.forma{background:#F3F6FB;border-radius:12px;padding:2px 14px 10px;margin-bottom:6px}
.frow{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:4px 0;gap:10px}
.fm{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:14px;margin-left:4px;color:#fff}
.fm.v{background:var(--ok)}.fm.p{background:var(--red)}.fm.n{background:#cfd8e6}
.reg details{background:#fff;border-radius:14px;margin-top:10px;box-shadow:0 2px 8px rgba(7,27,62,.07);overflow:hidden}
.reg summary{padding:15px 16px;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:var(--navy);list-style:none;cursor:pointer}
.reg summary::-webkit-details-marker{display:none}
.reg summary::after{content:"＋";float:right;color:var(--red)}
.reg details[open] summary::after{content:"－"}
.reg p{margin:0;padding:0 16px 16px;font-size:15px;line-height:1.5;color:#41536f}
.ov{position:fixed;inset:0;background:rgba(7,27,62,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-head{background:var(--navy);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:2;border-bottom:5px solid var(--c,var(--red))}
.sh-head h2{font-family:'Barlow Condensed';font-size:26px;margin:0}
.close{float:right;background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}
.sh-body{padding:14px 18px}
.plist button{display:block;width:100%;text-align:left;padding:15px 14px;margin-bottom:8px;border:2px solid #e1e7f0;border-radius:12px;background:#fff;font-family:inherit;font-weight:700;font-size:16px;color:var(--ink)}
.lbl{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#5a6b85;margin:20px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:15px 6px;border-radius:12px;border:2px solid #cfd8e6;background:#fff;font-family:inherit;font-weight:700;font-size:15px;color:var(--ink)}
.seg button.on{border-color:var(--navy2);background:var(--navy2);color:#fff}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
select.txt{appearance:none;-webkit-appearance:none;background:#fff}
.score{width:100%;border-collapse:separate;border-spacing:0 10px}
.score th{font-family:'Barlow Condensed';font-size:15px;color:var(--navy2);font-weight:700;line-height:1.1}
.score th small{color:#8a97ab;font-size:12px}
.score td{text-align:center}
.score .sn{font-family:'Barlow Condensed';font-weight:800;font-size:19px;color:#8a97ab;width:64px;text-align:left}
.score input{width:76px;height:76px;font-size:42px;font-weight:800;text-align:center;border:3px solid #cfd8e6;border-radius:18px;font-family:'Barlow Condensed';color:var(--navy);background:#F7F9FC;outline:none;padding:0}
.score input:focus{border-color:var(--navy2);background:#fff;box-shadow:0 0 0 5px rgba(29,78,216,.18)}
.score tr.ok input{border-color:var(--ok);background:#F1FBF4}
.score tr.bad input{border-color:var(--red);background:#FFF3F4}
.score tr.off{opacity:.3}
.dash{font-size:32px;font-weight:800;color:#b5c0d0}
.hint{font-size:14px;min-height:20px;color:var(--red);font-weight:700;text-align:center}
.win{background:var(--navy);color:#fff;border-radius:14px;padding:13px;text-align:center;font-weight:700;font-size:16px;margin-top:6px;display:none}
.win b{color:#FFD24D}
.txt{width:100%;padding:16px;font-size:17px;border:2px solid #cfd8e6;border-radius:12px;font-family:inherit;outline:none;color:var(--ink)}
.txt:focus{border-color:var(--navy2)}
.btn{width:100%;margin-top:22px;padding:19px;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:'Barlow Condensed';font-size:23px;font-weight:800;letter-spacing:1px}
.btn:disabled{background:#c9ced8}
.btn.sec{background:#fff;color:var(--navy2);border:2px solid var(--navy2);margin-top:10px;font-size:19px}
.big{font-family:'Barlow Condensed';font-size:46px;font-weight:800;color:var(--navy);text-align:center;margin:14px 0 4px;letter-spacing:2px}
.done{text-align:center;padding:24px 6px}
.ck{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:58px;line-height:96px;margin:0 auto 14px}
.info{background:#F3F6FB;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;color:#41536f;margin-top:4px}
footer{text-align:center;font-size:12px;color:#8a97ab;padding:6px 0 100px}
footer button{background:none;border:0;color:var(--navy2);font-weight:700;font-size:14px;font-family:inherit}
nav.tab{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -4px 18px rgba(7,27,62,.14);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tab button{flex:1;border:0;background:none;padding:8px 0 10px;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.4px;color:#8a97ab}
nav.tab button .i{display:block;font-size:22px;line-height:1.2}
nav.tab button.on{color:var(--red)}
.rip{background:#FFF8E6;border:2px dashed #E0B44C;border-radius:14px;padding:11px 14px;margin:6px 0 12px;color:#41536f;font-size:15px;line-height:1.45}
.rip .t{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:1px;color:#B07D00;margin-bottom:2px}
.rip b{color:var(--navy)}.rip .m{display:block;margin-top:4px;font-weight:700;color:var(--orange)}
.rip.me{background:#FFF1EC;border:3px dashed var(--orange)}.rip.me .t{color:var(--orange)}
.gp.rp{border-color:#E0B44C}
.pill.adm{background:#e9f7ef;color:#0b7a37}
.abtn{display:flex;gap:8px;margin-top:12px}.abtn button{flex:1;border:0;border-radius:10px;padding:12px 6px;font-weight:700;font-family:inherit;font-size:14px}
.abtn .y{background:var(--ok);color:#fff}.abtn .n{background:#fde4e6;color:var(--red)}.abtn .o{background:#e6ecf5;color:var(--navy2)}
.big2{font-family:'Barlow Condensed';font-weight:800;font-size:28px;color:var(--navy);line-height:1.1}
footer a{color:inherit;text-decoration:underline;cursor:pointer;display:inline-block;margin-top:8px}
</style></head>
<body>
<header>
  <div class="logo" id="logo"><div class="fb">MARCO POLO <span>SPORTS CENTER</span></div></div>

<script>
window.onerror = function (m, s, l) {
  var x = document.getElementById('list');
  if (x) x.innerHTML = '<div class="empty">Errore app: ' + m + ' (riga ' + l + ')</div>';
};
const COL = {D1:'var(--D1)', D2A:'var(--D2A)', D2B:'var(--D2B)', D2:'var(--D2)', FEM:'var(--FEM)', TUTTE:'var(--navy2)'};
const ORDINE = ['D1','D2A','D2B','FEM'];
const KEY = 'mpsc_giocatore', KEY_ADM = 'mpsc_admin';
const SUB = {home:'Inserisci il risultato della tua partita', cal:'Calendario della stagione', cla:'Classifiche e fase finale', sta:'Statistiche e riconoscimenti', inf:'Regolamento e contatti', adm:'Area super admin'};
let ALL = [], CLA = [], EX = {kpi:[],mvp:[],stat:[],reg:[],fin:[]}, SPO = {}, APP_URL = '', LINKS = [];
let SEZ = [], VIS = [], GIOC = [], OGGI = '', ME = '', TAB = 'home', CARICATO = false, ADM = '', ADMIN = null, AREQ = [], ADEC = [], aBusy = false, VAI_ADM = false, CHIESTO = false;
let filtro = 'TUTTE', soloTodo = false, cur = null, esito = 'Regolare', chi = '', acc = '';
let calDiv = '', calG = null, calMie = false, calRin = false, claDiv = '', staDiv = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const corto = s => String(s).split('/').map(x => x.trim().split(/\s+/).pop()).join(' / ');
const nomi = p => (p.casa + '/' + p.ospite).split('/').map(x => x.trim().toUpperCase()).filter(Boolean);
const gioca = (p, n) => nomi(p).includes(n);
const inCoppia = (c, n) => String(c).toUpperCase().split('/').map(x => x.trim()).includes(n);
const titolo = s => String(s).toLowerCase().replace(/(^|\s|')\S/g, m => m.toUpperCase());
const IDS = ['s1a','s1b','s2a','s2b','s3a','s3b'];
const val = id => { const x = $('#'+id).value; return x === '' ? null : Number(x); };
const okSet = (a,b) => { const M = Math.max(a,b), m = Math.min(a,b); return (M===6 && m<=4) || (M===7 && (m===5 || m===6)); };
const dUTC = s => new Date(s + 'T00:00:00Z');
const isoD = d => d.toISOString().slice(0,10);
const addG = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
const lun = d => addG(d, -((d.getUTCDay() + 6) % 7));
const sets = s => String(s || '').trim().split(/\s+/).map(x => x.split('-').map(Number)).filter(x => x.length===2 && !isNaN(x[0]) && !isNaN(x[1]));
const mySigla = () => ME ? ((ALL.find(p => gioca(p, ME)) || {}).sigla || '') : '';
const vuoto = v => !v || v === '—' || v === '-' || v === '0';

/* ---------- RIPOSI (coppie della division che non giocano nella giornata) ---------- */
const coppieDi = s => [...new Set([].concat(...ALL.filter(p => p.sigla===s).map(p => [String(p.casa).trim(), String(p.ospite).trim()])).filter(Boolean))];
const riposa = (s, g) => {
  const G = ALL.filter(p => p.sigla===s && Number(p.giornata)===Number(g)); if (!G.length) return [];
  const inC = new Set([].concat(...G.map(p => [String(p.casa).trim(), String(p.ospite).trim()])));
  return coppieDi(s).filter(c => !inC.has(c));
};
const ripBox = (s, g, full) => {
  const R = riposa(s, g); if (!R.length) return '';
  const me = !!ME && R.some(c => inCoppia(c, ME));
  return `<div class="rip ${me?'me':''}" style="--c:${COL[s]||'var(--navy2)'}"><span class="t">😴 ${full ? esc(s)+' · G'+esc(g)+' · ' : ''}${R.length>1?'RIPOSANO':'RIPOSA'}</span>`
    + R.map(c => `<b>${esc(c)}</b>`).join('<br>') + (me ? '<span class="m">In questa giornata la tua coppia riposa 😉</span>' : '') + '</div>';
};
const giornateDi = L => [...new Set(L.filter(p => !p.ghost && !p.rinvio).map(p => p.sigla + '|' + p.giornata))].map(k => k.split('|'))
  .sort((a,b) => ORDINE.indexOf(a[0]) - ORDINE.indexOf(b[0]) || Number(a[1]) - Number(b[1]));
const mioRiposo = L => ME ? giornateDi(L).filter(([s,g]) => riposa(s, g).some(c => inCoppia(c, ME))) : [];

/* ---------- STATI ---------- */
const inv = p => !!(p.inviato && !p.inviato.scartato);
const scart = p => !!(p.inviato && p.inviato.scartato);
const ritardo = p => !p.ghost && !p.refertata && !inv(p) && p.data && OGGI && p.data <= isoD(addG(dUTC(OGGI), -2));
const pDate = s => { const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? m[3] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[1]).slice(-2) : ''; };
const spoAttivo = p => {      // richiesta in attesa di decisione (anche per partite lontane nel tempo)
  const s = SPO[String(p.codice).toUpperCase()];
  if (!s || s.esito || p.refertata || p.rinvio) return false;
  if (p.data && p.data < OGGI) { const d = pDate(s.data); return !d || d >= isoD(addG(dUTC(OGGI), -10)); }
  return true;
};
const spoOk = p => { const s = SPO[String(p.codice).toUpperCase()]; return !!(s && s.esito === 'APPROVATO' && s.nuova && !p.refertata && !p.rinvio); };
const spoNo = p => { const s = SPO[String(p.codice).toUpperCase()]; return !!(s && s.esito === 'RIFIUTATO' && !p.refertata && ME && gioca(p, ME)); };

/* ---------- RINVII ---------- */
const GGN = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
const MESI = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const giornoIt = s => { const d = dUTC(s); return GGN[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESI[d.getUTCMonth()]; };
const gIt = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s)) ? titolo(giornoIt(s)) : String(s || '');
const breve = s => String(s).slice(8,10) + '/' + String(s).slice(5,7);
const ghosts = () => ALL.filter(p => p.rinvio && !p.refertata).map(p => ({ ghost:true, src:p, sigla:p.sigla, codice:p.codice, giornata:p.giornata,
  casa:p.casa, ospite:p.ospite, orario:'', campo:'', data:p.rinvio, giorno:giornoIt(p.rinvio) }));
const ord = L => L.sort((a,b) => (a.data + a.orario).localeCompare(b.data + b.orario));


/* ---------- MEMORIA: telefono + link personale (?me=Nome) ----------
   L'app gira dentro un riquadro Google su un altro dominio: Safari/iPhone, WhatsApp e alcuni
   browser cancellano o bloccano quella memoria. Per questo il nome viene salvato ANCHE nel link. */
const mem = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } },
  set(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e) {} }
};
ME = mem.get(KEY); ADM = mem.get(KEY_ADM);
let URLP = {};
function leggiUrl(cb){
  let fatto = false; const go = () => { if (!fatto) { fatto = true; cb(); } };
  try { google.script.url.getLocation(l => { URLP = (l && l.parameter) || {}; go(); }); } catch(e) {}
  setTimeout(go, 1500);
}
function scriviUrl(){ try { const p = {}; if (ME) p.me = titolo(ME); google.script.history.replace(null, p); } catch(e) {} }
function linkMio(){ return (APP_URL || '') + '?me=' + encodeURIComponent(titolo(ME)); }
function copia(t){
  const ko = () => prompt('Copia questo link e salvalo:', t);
  try { navigator.clipboard.writeText(t).then(() => alert('Link copiato ✔'), ko); } catch(e) { ko(); }
}


google.script.run.withSuccessHandler(src => {
  if (!src) return;
  const img = new Image(); img.alt = 'Marco Polo Sports Center';
  img.onload = () => { $('#logo').innerHTML = ''; $('#logo').appendChild(img); };
  img.src = src;
}).withFailureHandler(() => {}).getLogo();


leggiUrl(() => {
  const u = String(URLP.me || '').trim().toUpperCase();
  if (u) { ME = u; mem.set(KEY, ME); }
  if (URLP.adm) { ADM = String(URLP.adm); mem.set(KEY_ADM, ADM); VAI_ADM = true; }
  carica();
});


function carica(){
  CARICATO = false;
  $('#list').innerHTML = '<div class="loader">Carico le partite…</div>';
  setTimeout(() => { if (!CARICATO) $('#list').innerHTML = '<div class="empty">Il server non risponde.<br>Premi ↻ Aggiorna qui sotto.</div>'; }, 25000);
  google.script.run.withSuccessHandler(r => { try {
      CARICATO = true;
      ALL = r.partite || []; CLA = r.classifica || []; EX = r.extra || EX; SPO = r.spost || {}; APP_URL = r.url || ''; OGGI = r.oggi;
      ADMIN = r.admin || null;
      if (ADM && !ADMIN) { ADM = ''; mem.set(KEY_ADM, ''); }
      AREQ = ADMIN ? (ADMIN.richieste || []) : []; ADEC = ADMIN ? (ADMIN.decisioni || []) : [];
      $('#n-adm').style.display = ADMIN ? '' : 'none';
      prepara();
      if (ME && GIOC.length && !GIOC.includes(ME)) { ME = ''; mem.set(KEY, ''); }
      scriviUrl();
      chips(); mebar(); renderAll();
      if (VAI_ADM && ADMIN) { VAI_ADM = false; vai('adm'); }
      else if (!ME && GIOC.length && !CHIESTO) { CHIESTO = true; scegliGiocatore(); }
    } catch (err) { $('#list').innerHTML = '<div class="empty">⚠️ Errore nel mostrare le partite:<br><b>' + esc(err.message) + '</b></div>'; } })
    .withFailureHandler(e => { CARICATO = true; $('#list').innerHTML = '<div class="empty">Errore: '+esc(e.message)+'</div>'; })
    .getPartite(ADM || null);
}


function prepara(){
  const oggi = dUTC(OGGI), L = lun(oggi);
  const inW = (p, a, b) => p.data && p.data >= isoD(a) && p.data <= isoD(b);
  const X = ALL.concat(ghosts());
  let questa = ord(X.filter(p => inW(p, L, addG(L, 6))));
  const scorsa = ord(X.filter(p => inW(p, addG(L, -7), addG(L, -1))));
  const rec = ALL.filter(p => p.data && p.data < isoD(addG(L, -7)) && !p.refertata && !inv(p));
  SEZ = [];
  if (!questa.length && !scorsa.length) {
    const fut = ALL.filter(p => p.data && p.data >= OGGI).map(p => p.data).sort()[0];
    if (fut) { const L2 = lun(dUTC(fut)); questa = ord(X.filter(p => inW(p, L2, addG(L2, 6))));
      SEZ.push({ t: 'PROSSIMA SETTIMANA', cls: '', list: questa }); }
  } else {
    if (questa.length) SEZ.push({ t: 'QUESTA SETTIMANA', cls: '', list: questa });
    if (scorsa.length) SEZ.push({ t: 'SETTIMANA SCORSA', cls: '', list: scorsa });
  }
  if (rec.length) SEZ.push({ t: 'DA RECUPERARE', cls: 'rec', list: rec });
  VIS = [].concat(...SEZ.map(s => s.list));
  GIOC = [...new Set([].concat(...ALL.map(nomi)))].sort();
}


function renderAll(){ render(); renderCal(); renderCla(); renderSta(); renderInf(); renderAdm(); }


function vai(t){
  TAB = t;
  ['home','cal','cla','sta','inf','adm'].forEach(x => { $('#v-'+x).style.display = x===t ? 'block' : 'none'; $('#n-'+x).classList.toggle('on', x===t); });
  $('#q').style.display = t==='home' ? 'block' : 'none';
  $('#sub').textContent = SUB[t];
  renderAll(); window.scrollTo(0, 0);
}


function chips(){
  const pres = new Set(VIS.map(p => p.sigla));
  const s = ['TUTTE'].concat(ORDINE.filter(x => pres.has(x)));
  $('#chips').innerHTML = s.map(x => `<button class="chip ${x===filtro?'on':''}" onclick="filtro='${x}';chips();render()">${x==='TUTTE'?'Tutte':x}</button>`).join('')
    + `<button class="chip ${soloTodo?'on':''}" onclick="soloTodo=!soloTodo;chips();render()">Solo da inserire</button>`;
}


function mebar(){
  $('#mebar').innerHTML = ME
    ? `👤 <span>Sei <b>${esc(titolo(ME))}</b></span><button onclick="scegliGiocatore()">Non sei tu? Cambia</button>`
    : `👤 <span>Scegli il tuo nome per trovare subito la tua partita</span><button onclick="scegliGiocatore()">Scegli ›</button>`;
}


function bannerHome(){
  try { if (localStorage.getItem('mpsc_home')) return ''; } catch(e) {}
  return `<div class="hb">📲 <b>Metti l'app sulla Home</b> del telefono: la apri con un tocco, come una vera app. <a onclick="vai('inf')">Come si fa ›</a>
    <button onclick="try{localStorage.setItem('mpsc_home','1')}catch(e){};render()">✕</button></div>`;
}


function stato(p){
  let h = '';
  if (p.refertata) h = `<span class="pill offi">✔ Ufficiale · ${esc(p.refertata)}</span>`;
  else if (scart(p)) h = '<span class="pill todo">❌ Risultato non valido · reinseriscilo</span>';
  else if (inv(p)) {
    const I = p.inviato;
    if (I.approvato) h = `<span class="pill adm">🛡 ${esc(I.punteggio)} · approvato dall'organizzazione</span>`;
    else if (I.confermato) h = `<span class="pill sent">✅ ${esc(I.punteggio)} · confermato da entrambe</span>`;
    else if (I.discorde) h = '<span class="pill todo">⚠ Risultati diversi · in verifica</span>';
    else h = `<span class="pill sent">✅ Inserito · ${esc(I.punteggio)}</span>`;
  }
  else if (ritardo(p)) h = '<span class="pill todo">⏰ Risultato in ritardo · inseriscilo ora</span>';
  else h = '<span class="pill todo">● Risultato da inserire</span>';
  if (spoAttivo(p)) h += '<span class="pill spo">🔁 Spostamento richiesto · in valutazione</span>';
  else if (spoOk(p)) { const n = SPO[String(p.codice).toUpperCase()].nuova;
    h += `<span class="pill adm">🛡 Spostamento approvato · ${esc(gIt(n.data))}${n.ora ? ' · ' + esc(n.ora) : ''}${n.campo ? ' · ' + esc(n.campo) : ''}</span>`; }
  else if (spoNo(p)) h += '<span class="pill todo">✕ Spostamento non approvato · contatta l\'organizzazione</span>';
  if (p.rinvio) h += `<span class="pill rin">🔁 Recupero · era il ${breve(p.rinvio)}</span>`;
  return h;
}



function card(p, mine){
  if (p.ghost) {
    const r = p.src;
    return `<div class="card ghost" onclick="apri(${ALL.indexOf(r)})">
      <div class="meta"><span class="tag" style="background:#9aa6b8">${esc(p.sigla)}</span>G${esc(p.giornata)} · PARTITA RINVIATA<span class="code">${esc(p.codice)}</span></div>
      <div class="teams">${esc(p.casa)}<div class="vs">VS</div>${esc(p.ospite)}</div>
      <span class="pill rin">🔁 Si recupera ${esc(titolo(r.giorno))} · ${esc(r.orario)}</span></div>`;
  }
  const i = ALL.indexOf(p);
  const cta = inv(p) ? (p.inviato.confermato ? 'VEDI RISULTATO ›' : '✔ CONFERMA O MODIFICA ›') : (scart(p) ? 'INSERISCI DI NUOVO ›' : 'INSERISCI RISULTATO ›');
  const extra = mine ? `<div class="cta ${inv(p)?'sec':''}">${cta}</div>
      <div class="acts"><button onclick="event.stopPropagation();calAdd(${i})">📅 Nel calendario</button><button onclick="event.stopPropagation();spost(${i})">🔁 Chiedi spostamento</button></div>` : '';
  return `<div class="card ${mine?'mine':''}" style="--c:${COL[p.sigla]||'var(--navy2)'}" onclick="apri(${i})">
    <div class="meta"><span class="tag">${esc(p.sigla)}</span>${mine?esc(titolo(p.giorno))+' · ':''}G${esc(p.giornata)} · ${esc(p.orario)} · ${esc(p.campo)}<span class="code">${esc(p.codice)}</span></div>
    <div class="teams">${esc(p.casa)}<div class="vs">VS</div>${esc(p.ospite)}</div>${stato(p)}${extra}</div>`;
}


function render(){
  if (!ALL.length) { $('#list').innerHTML = '<div class="empty">Nessuna partita pubblicata.</div>'; return; }
  const q = $('#q').value.trim().toUpperCase();
  const soloMie = ME && !q && !window.TUTTE;
  $('#chips').style.display = (TAB!=='home' || soloMie) ? 'none' : 'flex';
  const ok = p => (filtro==='TUTTE' || p.sigla===filtro)
    && (!q || (p.casa+' '+p.ospite+' '+p.codice).toUpperCase().includes(q))
    && (!soloTodo || (!p.ghost && !p.refertata && !inv(p)));
  let html = q ? '' : bannerHome();
  const mie = ME && !q ? VIS.filter(p => gioca(p, ME)) : [];
  if (ME && !q) {
    const mr = mioRiposo(VIS);
    if (mie.length) { html += `<div class="sect mine-s">⭐ ${mie.length>1?'LE TUE PARTITE':'LA TUA PARTITA'}</div>`; mie.forEach(p => { html += card(p, !p.refertata && !p.ghost); });
      html += `<button class="btn sec" onclick="calTutte()">📅 Tutte le mie partite nel calendario</button>`; }
    else if (!mr.length) html += `<div class="empty" style="padding:26px 10px">Questa settimana non hai partite da compilare 🎾</div>`;
    html += mr.map(([x,g]) => ripBox(x, g, true)).join('');
  }
  if (soloMie) {
    html += `<button class="btn sec" style="margin-top:26px" onclick="window.TUTTE=true;render()">Vedi tutte le partite della settimana</button>`;
    $('#list').innerHTML = html; return;
  }
  if (ME && !q) html += `<button class="btn sec" style="margin-top:20px" onclick="window.TUTTE=false;render();window.scrollTo(0,0)">⭐ Mostra solo le mie partite</button>`;
  SEZ.forEach(s => {
    const L = s.list.filter(ok);
    const rb = (s.cls==='rec' || soloTodo) ? '' : giornateDi(s.list).filter(([x]) => filtro==='TUTTE' || x===filtro)
      .filter(([x,g]) => !q || riposa(x, g).join(' ').toUpperCase().includes(q)).map(([x,g]) => ripBox(x, g, true)).join('');
    if (!L.length && !rb) return;
    html += `<div class="sect ${s.cls}">${s.t}</div>`; let g = '';
    L.forEach(p => { if (p.giorno !== g) { g = p.giorno; html += `<div class="day">${esc(String(g).toLowerCase())}</div>`; } html += card(p, false); });
    html += rb;
  });
  $('#list').innerHTML = html || '<div class="empty">Nessuna partita trovata.</div>';
}


function mcard(p, full){
  const s = sets(p.refertata); let wc = 0, wo = 0; s.forEach(x => { if (x[0] > x[1]) wc++; else wo++; });
  const sc = k => s.length ? `<span class="sc">${s.map(x => `<span>${x[k]}</span>`).join('')}</span>` : '';
  const me = ME && gioca(p, ME);
  const pre = full ? `<span class="tag">${esc(p.sigla)}</span>${esc(titolo(p.giorno))} · G${esc(p.giornata)} · ` : '';
  return `<div class="mc ${me?'me':''}" style="--c:${COL[p.sigla]||'var(--navy2)'}" onclick="apri(${ALL.indexOf(p)})">
    <div class="meta">${pre}${esc(p.orario)} · ${esc(p.campo)}<span class="code">${esc(p.codice)}</span></div>
    <div class="row ${s.length && wc>wo ? 'w' : ''}"><span>${esc(p.casa)}</span>${sc(0)}</div>
    <div class="row ${s.length && wo>wc ? 'w' : ''}"><span>${esc(p.ospite)}</span>${sc(1)}</div>
    ${!s.length && inv(p) ? (p.inviato.approvato ? '<span class="pill adm">🛡 ' + esc(p.inviato.punteggio) + ' · approvato</span>' : '<span class="pill sent">✅ Risultato inviato · in verifica</span>') : ''}
    ${!s.length && scart(p) ? '<span class="pill todo">❌ Risultato da reinserire</span>' : ''}
    ${!s.length && ritardo(p) && !scart(p) ? '<span class="pill todo">⏰ Risultato in ritardo</span>' : ''}
    ${p.rinvio && !s.length ? `<span class="pill rin">🔁 Recupero · era il ${breve(p.rinvio)}</span>` : ''}
    ${!s.length && spoAttivo(p) ? '<span class="pill spo">🔁 Spostamento in valutazione</span>' : ''}
    ${!s.length && spoOk(p) ? '<span class="pill adm">🛡 Spostata · ' + esc(gIt(SPO[String(p.codice).toUpperCase()].nuova.data)) + ' ' + esc(SPO[String(p.codice).toUpperCase()].nuova.ora || '') + '</span>' : ''}</div>`;
}


/* ---------- LE MIE STATISTICHE ---------- */
function mieStat(){
  let g = 0, v = 0, sv = 0, sp = 0, gv = 0, gp = 0;
  ALL.filter(p => gioca(p, ME) && p.refertata).forEach(p => {
    const s = sets(p.refertata); if (!s.length) return;
    const casa = inCoppia(p.casa, ME); let a = 0, b = 0;
    s.forEach(x => { const m = casa ? x[0] : x[1], o = casa ? x[1] : x[0]; gv += m; gp += o; if (m > o) a++; else b++; });
    g++; if (a > b) v++; sv += a; sp += b;
  });
  const r = CLA.find(x => inCoppia(x.coppia, ME)); const d = gv - gp;
  const K = [[g,'Giocate'], [v + ' – ' + (g - v),'Vinte – Perse'], [sv + ' – ' + sp,'Set vinti – persi'], [(d > 0 ? '+' : '') + d,'Differenza game'],
             [r ? r.pos + '°' : '—','Posizione'], [r ? r.punti : '—','Punti']];
  return `<div class="kgrid">${K.map(k => `<div class="kpi"><b>${esc(k[0])}</b><span>${k[1]}</span></div>`).join('')}</div>`;
}


function renderCal(){
  const v = $('#v-cal'); if (!ALL.length) { v.innerHTML = '<div class="empty">Nessuna partita pubblicata.</div>'; return; }
  const divs = ORDINE.filter(s => ALL.some(p => p.sigla===s));
  if (!calDiv) calDiv = mySigla() || divs[0];
  const haRin = ALL.some(p => p.rinvio && !p.refertata);
  let h = `<div class="chips">${divs.map(s => `<button class="chip ${s===calDiv && !calMie && !calRin?'on':''}" onclick="calDiv='${s}';calMie=false;calRin=false;calG=null;renderCal()">${s}</button>`).join('')}`
    + (ME ? `<button class="chip ${calMie?'on':''}" onclick="calMie=!calMie;calRin=false;renderCal()">⭐ Le mie</button>` : '')
    + (haRin ? `<button class="chip ${calRin?'on':''}" onclick="calRin=!calRin;calMie=false;renderCal()">🔁 Rinviate</button>` : '') + '</div>';
  if (calRin) {
    const R = ord(ALL.filter(p => p.rinvio && !p.refertata));
    h += `<div class="sect rec">🔁 PARTITE RINVIATE · DA RECUPERARE</div>`;
    h += R.length ? R.map(p => mcard(p, true)).join('') : '<div class="empty">Nessuna partita rinviata.</div>';
    v.innerHTML = h; return;
  }
  if (calMie) {
    const M = ALL.filter(p => gioca(p, ME));
    h += `<div class="sect mine-s">📊 I MIEI NUMERI</div>` + mieStat();
    h += `<div class="sect mine-s">⭐ IL TUO CALENDARIO</div>`;
    if (M.some(p => p.data >= OGGI && !p.refertata)) h += `<button class="btn" style="margin-top:12px" onclick="calTutte()">📅 AGGIUNGI TUTTE AL CALENDARIO</button>`;
    const ms = mySigla(), fatti = new Set();
    const rg = ms ? [...new Set(ALL.filter(p => p.sigla===ms).map(p => Number(p.giornata)))].sort((a,b) => a-b).filter(g => riposa(ms, g).some(c => inCoppia(c, ME))) : [];
    let out = '';
    M.forEach(p => { rg.forEach(g => { if (!fatti.has(g) && p.sigla===ms && !p.rinvio && Number(p.giornata) > g) { out += ripBox(ms, g, true); fatti.add(g); } }); out += mcard(p, true); });
    rg.forEach(g => { if (!fatti.has(g)) out += ripBox(ms, g, true); });
    h += out || '<div class="empty">Nessuna partita trovata.</div>';
    v.innerHTML = h; return;
  }
  const L = ALL.filter(p => p.sigla===calDiv);
  const gs = [...new Set(L.map(p => Number(p.giornata)))].sort((a,b) => a-b);
  if (calG===null) { const lu = isoD(lun(dUTC(OGGI))); const nx = L.find(p => p.data >= lu); calG = nx ? Number(nx.giornata) : gs[gs.length-1]; }
  h += `<div class="gpills">${gs.map(g => { const t = L.filter(p => Number(p.giornata)===g); const fatto = t.length && t.every(p => p.refertata);
      return `<button class="gp ${g===calG?'on':''} ${fatto?'done':''} ${ME && riposa(calDiv, g).some(c => inCoppia(c, ME))?'rp':''}" onclick="calG=${g};renderCal()">G${g}</button>`; }).join('')}</div>`;
  const G = L.filter(p => Number(p.giornata)===calG);
  h += `<div class="sect" style="background:${COL[calDiv]}">${esc(calDiv)} · GIORNATA ${calG}</div>`;
  let gg = ''; G.forEach(p => { if (p.giorno !== gg) { gg = p.giorno; h += `<div class="day">${esc(String(gg).toLowerCase())}</div>`; } h += mcard(p, false); });
  h += ripBox(calDiv, calG, false);
  v.innerHTML = h;

function esitiCoppia(coppia, escl){
  return ALL.filter(p => p !== escl && p.refertata && (p.casa === coppia || p.ospite === coppia))
    .sort((a,b) => String(b.data).localeCompare(String(a.data))).slice(0, 5)
    .map(p => { const s = sets(p.refertata); let wc = 0, wo = 0; s.forEach(x => { if (x[0] > x[1]) wc++; else wo++; });
      const w = p.casa === coppia ? wc > wo : wo > wc; return `<span class="fm ${w?'v':'p'}">${w?'V':'P'}</span>`; }).join('');
}
function formaBox(p){
  const a = esitiCoppia(p.casa, p), b = esitiCoppia(p.ospite, p);
  const prec = ALL.filter(x => x !== p && x.refertata && ((x.casa===p.casa && x.ospite===p.ospite) || (x.casa===p.ospite && x.ospite===p.casa)));
  if (!a && !b && !prec.length) return '';
  const inverti = s => sets(s).map(x => x[1] + '-' + x[0]).join('  ');
  let h = `<div class="forma"><div class="lbl" style="margin-top:10px">📈 Forma · ultime 5 partite</div>
    <div class="frow"><span>${esc(corto(p.casa))}</span><span>${a || '<span class="fm n">—</span>'}</span></div>
    <div class="frow"><span>${esc(corto(p.ospite))}</span><span>${b || '<span class="fm n">—</span>'}</span></div>`;
  if (prec.length) h += `<div class="lbl">🤝 Precedenti</div>` + prec.map(x => `<div class="frow"><span>${esc(titolo(x.giorno))} · ${esc(x.codice)}</span><b>${esc(x.casa===p.casa ? x.refertata : inverti(x.refertata))}</b></div>`).join('');
  return h + '</div>';
}

function valida(){
  const reg = esito==='Regolare'; let ok = true, msg = '', vc = 0, vo = 0;
  [1,2,3].forEach(n => {
    const tr = $('#r'+n); tr.className = '';
    if (n===3) { const need = !reg || (vc===1 && vo===1);
      $('#s3a').disabled = !need; $('#s3b').disabled = !need;
      if (!need) { tr.className = 'off'; $('#s3a').value = ''; $('#s3b').value = ''; return; } }
    const a = val('s'+n+'a'), b = val('s'+n+'b');
    if (!reg) return;
    if (a===null || b===null) { ok = false; if ((a===null) !== (b===null)) tr.className = 'bad'; return; }
    if (okSet(a,b)) { tr.className = 'ok'; if (a>b) vc++; else vo++; }
    else { tr.className = 'bad'; ok = false; msg = 'Set ' + n + ' non valido: si vince 6-0…6-4, 7-5 o 7-6'; }
  });
  if (reg && ok && vc<2 && vo<2) ok = false;
  $('#hint').textContent = msg;
  const w = $('#win');
  if (reg && ok) { w.style.display = 'block'; w.innerHTML = `🏆 Vince <b>${esc(corto(vc===2?cur.casa:cur.ospite))}</b> · ${Math.max(vc,vo)}-${Math.min(vc,vo)}`; }
  else w.style.display = 'none';
  $('#go').disabled = !(ok && chi && $('#nome').value.trim().length >= 3);
}

    <div style="text-align:center;font-weight:700">${esc(cur.casa)}<div class="vs">VS</div>${esc(cur.ospite)}</div>
    <div style="text-align:center;color:#5a6b85;margin-top:10px">Inviato da ${esc($('#nome').value.trim())} (${esc(chi)})</div>
    <button class="btn" id="send" onclick="invia()">✔ CONFERMA E INVIA</button>
    <button class="btn sec" onclick="indietro()">✎ Modifica</button>`;
}
function indietro(){ $('#conf').style.display = 'none'; $('#form').style.display = 'block'; }
function invia(){
  const b = $('#send'); b.disabled = true; b.textContent = 'INVIO IN CORSO…';
  const d = { codice:cur.codice, chi:chi, nome:$('#nome').value.trim(), esito:esito, note:$('#note').value.trim(), set:IDS.map(id => $('#'+id).value), token: ADMQ(cur) ? ADM : '' };
  google.script.run.withSuccessHandler(r => {
      const dop = r && r.doppio;
      if (dop === 'uguale') { if (r.confermato) cur.inviato.confermato = d.nome; }
      else cur.inviato = { id:(r && r.id) || '', nome:d.nome, chi:d.chi, punteggio:(r && r.punteggio) || esito,
                           discorde: (dop === 'diverso' && cur.inviato && cur.inviato.chi !== d.chi) ? cur.inviato.punteggio : '' };
      renderAll(); if (ADMIN) carica();
      const msg = dop === 'uguale' ? 'Risultato confermato: coincide con quello già inserito.'
        : dop === 'diverso' ? 'Risultato inviato. È diverso da quello già inserito: l\'organizzazione verificherà.'
        : 'Risultato inviato. L\'organizzazione lo verifica e lo pubblica in classifica.';
      $('#conf').innerHTML = `<div class="done"><div class="ck">✓</div><div class="big" style="font-size:34px">GRAZIE!</div>
        <div>${msg}</div>
        <button class="btn" onclick="chiudi()">TORNA ALLE PARTITE</button></div>`; })
    .withFailureHandler(e => { b.disabled = false; b.textContent = '✔ CONFERMA E INVIA'; alert(e.message); })
    .inviaRisultato(d);
}



/* ---------- SPOSTAMENTO ---------- */
function spost(i){
  if (ADMQ(ALL[i])) return spostAdm(i);
  cur = ALL[i]; chi = ''; acc = '';
  const fasce = ['Indifferente','18:00','19:30','21:00'].map(x => `<option>${x}</option>`).join('');
  const sh = mostra(cur);
  sh.innerHTML = head(cur) + `<div class="sh-body" id="sform">
    <div class="info">🔁 La richiesta arriva all'organizzazione, che ti confermerà <b>nuovo giorno, ora e campo</b>. Se possibile mettiti prima d'accordo con gli avversari.</div>
    <div class="lbl">Chi richiede?</div>
    <div class="seg" id="chi"><button data-v="Coppia di casa" onclick="setChi('Coppia di casa')">Coppia di casa</button><button data-v="Coppia ospite" onclick="setChi('Coppia ospite')">Coppia ospite</button></div>
    <div class="lbl">Nome e cognome</div><input class="txt" id="snome" placeholder="es. Mario Rossi" oninput="validaS()">
    <div class="lbl">Telefono (facoltativo)</div><input class="txt" id="stel" type="tel" placeholder="es. 333 1234567">
    <div class="lbl">1ª data preferita</div><div class="two"><input class="txt" id="sd1" type="date" min="${OGGI}" onchange="validaS()"><select class="txt" id="sf1">${fasce}</select></div>
    <div class="lbl">2ª data (facoltativa)</div><div class="two"><input class="txt" id="sd2" type="date" min="${OGGI}"><select class="txt" id="sf2">${fasce}</select></div>
    <div class="lbl">Gli avversari sono d'accordo?</div>
    <div class="seg" id="acc"><button data-v="Sì" onclick="setAcc('Sì')">Sì</button><button data-v="Da chiedere" onclick="setAcc('Da chiedere')">Da chiedere</button></div>
    <div class="lbl">Note (facoltative)</div><input class="txt" id="snote" placeholder="es. possiamo anche il venerdì">
    <button class="btn" id="sgo" disabled onclick="inviaS()">INVIA RICHIESTA</button></div>`;
  if (ME && gioca(cur, ME)) { $('#snome').value = titolo(ME); setChi(inCoppia(cur.casa, ME) ? 'Coppia di casa' : 'Coppia ospite'); }

}
function setAcc(x){ acc = x; document.querySelectorAll('#acc button').forEach(b => b.classList.toggle('on', b.dataset.v===x)); validaS(); }
function validaS(){ const g = $('#sgo'); if (g) g.disabled = !(chi && acc && $('#snome').value.trim().length >= 3 && $('#sd1').value); }
function inviaS(){
  const b = $('#sgo'); b.disabled = true; b.textContent = 'INVIO IN CORSO…';
  const d = { codice:cur.codice, chi:chi, nome:$('#snome').value.trim(), tel:$('#stel').value.trim(), data1:$('#sd1').value, fascia1:$('#sf1').value,
              data2:$('#sd2').value, fascia2:$('#sf2').value, accordo:acc, note:$('#snote').value.trim() };
  google.script.run.withSuccessHandler(() => {
      SPO[String(cur.codice).toUpperCase()] = { nome:d.nome }; renderAll();
      $('#sform').innerHTML = `<div class="done"><div class="ck">✓</div><div class="big" style="font-size:34px">RICHIESTA INVIATA</div>
        <div>L'organizzazione ti contatterà per confermare il nuovo orario.</div>
        <button class="btn" onclick="chiudi()">TORNA ALLE PARTITE</button></div>`; })
    .withFailureHandler(e => { b.disabled = false; b.textContent = 'INVIA RICHIESTA'; alert(e.message); })
    .inviaSpostamento(d);
}


/* ======================================================================
   🛡 SUPER ADMIN
   ====================================================================== */
const kc = p => String(p.codice).toUpperCase();
// sulle partite che giochi tu resti un giocatore normale: inserisci/chiedi come la tua coppia
const ADMQ = p => !!ADMIN && !!p && !(ME && gioca(p, ME));
function areaAdmin(){
  if (ADMIN) { chiudi(); vai('adm'); return; }
  const sh = $('#sheet'); sh.style.removeProperty('--c');
  sh.innerHTML = `<div class="sh-head"><button class="close" onclick="chiudi()">✕</button><h2>🛡 AREA ORGANIZZAZIONE</h2>
    <div style="opacity:.8;font-size:14px">Accesso riservato al super admin</div></div>
    <div class="sh-body"><div class="lbl">PIN</div>
    <input class="txt" id="apin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')loginA()">
    <button class="btn" id="ago" onclick="loginA()">ENTRA</button></div>`;
  $('#ov').classList.add('show'); document.body.style.overflow = 'hidden';
  setTimeout(() => { const x = $('#apin'); if (x) x.focus(); }, 150);
}
function loginA(){
  const b = $('#ago'); b.disabled = true; b.textContent = 'VERIFICA…';
  google.script.run.withSuccessHandler(r => { ADM = r.token; mem.set(KEY_ADM, ADM); VAI_ADM = true; chiudi(); carica(); })
    .withFailureHandler(e => { b.disabled = false; b.textContent = 'ENTRA'; alert(e.message); })
    .loginAdmin($('#apin').value);
}
function esciAdmin(){
  ADM = ''; ADMIN = null; AREQ = []; ADEC = []; mem.set(KEY_ADM, '');
  $('#n-adm').style.display = 'none'; vai('home'); carica();
}
function adminCall(fn, arg, ok){
  if (aBusy) return; aBusy = true;
  google.script.run
    .withSuccessHandler(r => { aBusy = false; if (ok) ok(r); carica(); })
    .withFailureHandler(e => { aBusy = false; alert(e.message); if (/scadut/i.test(e.message)) esciAdmin(); })[fn](ADM, arg);
}
function decRis(i, az){
  const p = ALL[i]; if (!p || !p.inviato) return; let note = '';
  if (az === 'RESPINTO') { note = prompt('Respingi ' + p.inviato.punteggio + '?\nIl risultato tornerà "da reinserire".\nMotivo (facoltativo):', ''); if (note === null) return; }
  else if (!confirm('Approvi ' + p.inviato.punteggio + '\n' + p.casa + '  vs  ' + p.ospite + ' ?')) return;
  adminCall('adminRisultato', { codice:p.codice, id:p.inviato.id, azione:az, note:note }, () => chiudi());
}
function annullaDec(id){ if (confirm('Annullo questa decisione?')) adminCall('adminAnnulla', id); }
function admRisBox(p){
  const I = p.inviato || {}, i = ALL.indexOf(p);
  if (I.approvato) return `<div class="pill adm box" style="margin-top:12px">🛡 Già approvato dall'organizzazione</div>`;
  return `<div class="abtn"><button class="y" onclick="decRis(${i},'APPROVATO')">🛡 ✔ APPROVA</button><button class="n" onclick="decRis(${i},'RESPINTO')">✕ RESPINGI</button></div>`;
}
function spoBox(p){
  const s = SPO[kc(p)]; if (!s) return '';
  if (spoAttivo(p)) return `<div class="pill spo box">🔁 Spostamento già richiesto da ${esc(s.nome)}: in valutazione.</div>`;
  if (spoOk(p)) return `<div class="pill adm box">🛡 Spostamento approvato: ${esc(gIt(s.nuova.data))} ${esc(s.nuova.ora || '')} ${esc(s.nuova.campo || '')}${s.nuova.note ? '<br>' + esc(s.nuova.note) : ''}</div>`;
  if (s.esito === 'RIFIUTATO') return `<div class="pill todo box">✕ Ultima richiesta di spostamento non approvata${s.nuova && s.nuova.note ? ': ' + esc(s.nuova.note) : ''}</div>`;
  return '';
}
function richiestaDi(p){ return AREQ.filter(x => x.codice === kc(p)).pop() || SPO[kc(p)] || {}; }
function infoRich(r){
  return `🔁 Richiesta di <b>${esc(r.nome)}</b> (${esc(r.chi)})${r.tel ? ' · 📞 <a href="tel:' + esc(r.tel) + '">' + esc(r.tel) + '</a>' : ''}<br>
    1ª: <b>${esc(gIt(r.data1))} · ${esc(r.fascia1 || '')}</b>${r.data2 ? '<br>2ª: <b>' + esc(gIt(r.data2)) + ' · ' + esc(r.fascia2 || '') + '</b>' : ''}
    <br>Avversari d'accordo: <b>${esc(r.accordo || '—')}</b>${r.note ? '<br>Note: ' + esc(r.note) : ''}`;
}
function spostAdm(i){
  cur = ALL[i]; const s = SPO[kc(cur)], pend = !!(s && !s.esito), r = pend ? richiestaDi(cur) : {};
  const d1 = pend && /^\d{4}-\d{2}-\d{2}$/.test(r.data1 || '') ? r.data1 : '';
  const o1 = pend && /\d/.test(r.fascia1 || '') ? r.fascia1 : cur.orario;
  const sh = mostra(cur);
  sh.innerHTML = head(cur) + `<div class="sh-body">
    <div class="info">${pend ? infoRich(r) : "🛡 Spostamento deciso dall'organizzazione: viene registrato come già approvato."}</div>
    <div class="info" style="margin-top:8px">Ora in calendario: <b>${esc(titolo(cur.giorno))} · ${esc(cur.orario)} · ${esc(cur.campo)}</b></div>
    <div class="lbl">Nuova data</div><input class="txt" id="xd" type="date" value="${d1}">
    <div class="two"><div><div class="lbl">Orario</div><input class="txt" id="xo" placeholder="es. 19:30" value="${esc(o1)}"></div>
      <div><div class="lbl">Campo</div><input class="txt" id="xc" value="${esc(cur.campo)}"></div></div>
    <div class="lbl">Note per i giocatori (facoltative)</div><input class="txt" id="xn" placeholder="es. confermato con entrambe le coppie">
    <button class="btn" onclick="spostAdmGo(${i},'APPROVATO')">🛡 ✔ ${pend ? 'APPROVA SPOSTAMENTO' : 'SPOSTA PARTITA'}</button>
    ${pend ? `<button class="btn sec" onclick="spostAdmGo(${i},'RIFIUTATO')">✕ RIFIUTA RICHIESTA</button>` : ''}</div>`;
}
function spostAdmGo(i, az){
  const p = ALL[i], s = SPO[kc(p)], pend = !!(s && !s.esito);
  const d = { codice:p.codice, id: pend ? s.id : '', diretto: !pend, azione:az, data:$('#xd').value, ora:$('#xo').value.trim(), campo:$('#xc').value.trim(), note:$('#xn').value.trim() };
  if (az === 'APPROVATO' && !d.data) { alert('Indica la nuova data.'); return; }
  if (az === 'RIFIUTATO' && !confirm('Rifiuti la richiesta di spostamento?')) return;
  adminCall('adminSpostamento', d, () => chiudi());
}
function renderAdm(){
  const v = $('#v-adm'); if (!v) return;
  if (!ADMIN) { v.innerHTML = ''; return; }
  const R = ALL.filter(p => inv(p) && !p.refertata && !p.inviato.approvato)
    .sort((a,b) => (b.inviato.discorde ? 1 : 0) - (a.inviato.discorde ? 1 : 0) || String(a.data).localeCompare(String(b.data)));
  const S = ord(ALL.filter(p => spoAttivo(p)));
  const late = ALL.filter(p => ritardo(p) && !scart(p));
  let h = `<div class="sect">🛡 SUPER ADMIN · ${esc(titolo(ADMIN.nome).toUpperCase())}</div>
    <div class="kgrid"><div class="kpi"><b>${R.length}</b><span>Risultati da approvare</span></div><div class="kpi"><b>${S.length}</b><span>Spostamenti in attesa</span></div>
    <div class="kpi"><b>${R.filter(p => p.inviato.discorde).length}</b><span>Risultati discordanti</span></div><div class="kpi"><b>${late.length}</b><span>Risultati in ritardo</span></div></div>`;
  h += `<div class="sect rec">✅ RISULTATI DA APPROVARE (${R.length})</div>`;
  h += R.length ? R.map(p => { const I = p.inviato, i = ALL.indexOf(p);
    return `<div class="card" style="--c:${COL[p.sigla]||'var(--navy2)'};cursor:default">
      <div class="meta"><span class="tag">${esc(p.sigla)}</span>${esc(titolo(p.giorno))} · G${esc(p.giornata)}<span class="code">${esc(p.codice)}</span></div>
      <div class="teams">${esc(p.casa)}<div class="vs">VS</div>${esc(p.ospite)}</div>
      <div class="big2">${esc(I.punteggio)}</div>
      <div style="color:#5a6b85;font-size:14px;margin-bottom:6px">Inserito da ${esc(I.nome)} (${esc(I.chi)}) · ${esc(I.data)}</div>
      ${I.confermato ? `<span class="pill sent">✔✔ Confermato da ${esc(I.confermato)}</span>` : ''}
      ${I.discorde ? `<span class="pill todo">⚠ L'altra coppia aveva inserito ${esc(I.discorde)}</span>` : ''}
      <div class="abtn"><button class="y" onclick="decRis(${i},'APPROVATO')">✔ Approva</button><button class="n" onclick="decRis(${i},'RESPINTO')">✕ Respingi</button><button class="o" onclick="apri(${i})">✎ Correggi</button></div></div>`; }).join('')
    : '<div class="empty" style="padding:24px">Nessun risultato in attesa 👍</div>';
  h += `<div class="sect">🔁 RICHIESTE DI SPOSTAMENTO (${S.length})</div>`;
  h += S.length ? S.map(p => { const i = ALL.indexOf(p);
    return `<div class="card" style="--c:${COL[p.sigla]||'var(--navy2)'};cursor:default">
      <div class="meta"><span class="tag">${esc(p.sigla)}</span>${esc(titolo(p.giorno))} · ${esc(p.orario)} · ${esc(p.campo)}<span class="code">${esc(p.codice)}</span></div>
      <div class="teams">${esc(p.casa)}<div class="vs">VS</div>${esc(p.ospite)}</div>
      <div class="info">${infoRich(richiestaDi(p))}</div>
      <div class="abtn"><button class="y" onclick="spostAdm(${i})">🔁 Gestisci ›</button></div></div>`; }).join('')
    : '<div class="empty" style="padding:24px">Nessuna richiesta in attesa 👍</div>';
  h += `<div class="info" style="margin-top:14px">💡 Per <b>spostare una partita senza richiesta</b>: aprila dal Calendario e tocca <b>🔁 Sposta / gestisci spostamento</b>. Per <b>inserire un risultato</b> aprila e compilalo: sarà già approvato.</div>`;
  h += `<div class="sect">🗂 ULTIME DECISIONI</div>`;
  h += ADEC.length ? ADEC.map(z => `<div class="card" style="cursor:default;${z.annullato ? 'opacity:.5' : ''}">
      <div class="meta">${esc(z.quando)} · ${esc(z.tipo)}<span class="code">${esc(z.codice)}</span></div>
      <div><b>${esc(z.azione)}</b> · ${esc(z.partita)}<br><span style="color:#5a6b85">${esc(z.dettaglio)}${z.nd ? ' → ' + esc(gIt(z.nd)) + ' ' + esc(z.ora) + ' ' + esc(z.campo) : ''}${z.note ? '<br>' + esc(z.note) : ''}</span></div>
      ${z.annullato ? '<span class="pill">Annullata</span>' : `<div class="abtn"><button class="o" onclick="annullaDec('${esc(z.id)}')">↶ Annulla</button></div>`}</div>`).join('')
    : '<div class="empty" style="padding:24px">Nessuna decisione ancora.</div>';
  h += `<div class="info" style="margin-top:14px">Ogni decisione arriva nel file Excel: <b>📥 INBOX RISULTATI</b> (colonna APPROVA) e <b>📥 INBOX SPOSTAMENTI</b> (note e data approvata) al prossimo ① IMPORTA. In classifica il risultato diventa ufficiale quando lo importi in Excel.</div>
    <button class="btn sec" onclick="copia(APP_URL + '?adm=' + ADM)">🔗 Copia il mio link admin (non condividerlo!)</button>
    <button class="btn sec" onclick="esciAdmin()">Esci dall'area admin</button>`;
  v.innerHTML = h;
}


/* ---------- TUTTE LE MIE PARTITE NEL CALENDARIO ---------- */
function calTutte(){
  const M = ALL.filter(p => gioca(p, ME) && p.data && p.data >= OGGI && !p.refertata);
  if (!M.length) { alert('Non hai partite in programma.'); return; }
  LINKS = [APP_URL + '?ics=' + encodeURIComponent(M.map(p => p.codice).join(','))];

  sh.innerHTML = `<div class="sh-head"><button class="close" onclick="chiudi()">✕</button><h2>TUTTE LE TUE PARTITE</h2>
    <div style="opacity:.8;font-size:14px">${M.length} partite in programma</div></div>
    <div class="sh-body"><button class="btn" onclick="window.open(LINKS[0],'_blank')">📅 AGGIUNGI TUTTE (${M.length})</button>
    <div class="info" style="margin-top:14px">🍎 <b>iPhone</b>: si apre l'elenco, tocca <b>Aggiungi tutti</b>.<br>
    🤖 <b>Android</b>: apri il file scaricato e scegli Google Calendar o il calendario del telefono.<br><br>
    Se una partita viene spostata, ripeti l'operazione.</div></div>`;
}


/* ---------- CALENDARIO TELEFONO ---------- */
function calAdd(i){
  const p = ALL[i];
  const m = String(p.orario).match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/) || [0,'20','00','21','30'];
  const z = x => ('0'+x).slice(-2), d = String(p.data).replace(/-/g,'');
  const s = d+'T'+z(m[1])+m[2]+'00', e = d+'T'+z(m[3])+m[4]+'00';
  LINKS = [APP_URL + '?ics=' + encodeURIComponent(p.codice),
    'https:\/\/calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('MPSC Padel League · '+p.sigla+' '+p.codice)
    + '&dates=' + s + '/' + e + '&ctz=Europe/Rome&location=' + encodeURIComponent('Marco Polo Sports Center · '+p.campo)
    + '&details=' + encodeURIComponent(p.casa+' vs '+p.ospite)];
  const sh = mostra(p);
  sh.innerHTML = head(p) + `<div class="sh-body"><div class="lbl">Aggiungi la partita al calendario del telefono</div>
    <button class="btn" onclick="window.open(LINKS[0],'_blank')">🍎 iPhone / Outlook</button>
    <button class="btn sec" onclick="window.open(LINKS[1],'_blank')">📆 Google Calendar (Android)</button>
    <div class="info" style="margin-top:14px">Ti arriverà anche un promemoria 2 ore prima della partita.</div></div>`;
}
</script><script>
/* Salva giocatore e accesso admin anche nella pagina esterna (iPhone) */
(function () {
  function invia(k, v) { try { window.top.postMessage({ mpsc: 1, k: k, v: v || '' }, '*'); } catch (e) {} }
  try {
    var orig = mem.set;
    mem.set = function (k, v) { try { orig.call(mem, k, v); } catch (e) {} invia(k, v); };
    ['mpsc_giocatore', 'mpsc_admin'].forEach(function (k) { var v = mem.get(k); if (v) invia(k, v); });
  } catch (e) {}
})();
</script>
